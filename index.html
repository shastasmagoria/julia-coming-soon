<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Julia | Construction Management Software</title>
  <meta
    name="description"
    content="Julia is construction management software by Night Heron Labs. In development."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Jost:wght@300&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css">
  <script>
    // Hold the wordmark and byline back for the living-line entrance.
    // If the animation script never runs, everything is revealed after a few seconds.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('entrance');
      window.entranceFallback = setTimeout(function () {
        document.documentElement.classList.add('entrance-done');
      }, 5000);
    }
  </script>
  <script src="living-line.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="announcement" aria-labelledby="brand-name">
      <h1 id="brand-name" class="brand">
        <img class="wordmark" src="julia-signature.svg" alt="Julia" width="950" height="210">
      </h1>
      <p class="byline">by Night Heron Labs</p>
    </section>
    <footer class="details">
      <p class="descriptor">construction management software</p>
      <div class="rule" aria-hidden="true"></div>
      <p class="status">in development</p>
    </footer>
  </main>
</body>
</html>
